# Active for every `mvnw test` run (set by maven-surefire-plugin in
# pom.xml). Replaces the PostgreSQL datasource from the main
# application.properties with a fresh in-memory H2 database in PostgreSQL
# compatibility mode, so tests never need Docker and never touch the
# development database. Flyway still runs the same migrations against it.
spring.datasource.url=jdbc:h2:mem:hospital-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
