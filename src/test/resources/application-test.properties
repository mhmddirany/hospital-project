# Active for every `mvnw test` run (set by maven-surefire-plugin in
# pom.xml). Replaces the PostgreSQL datasource from the main
# application.properties with a fresh in-memory H2 database in PostgreSQL
# compatibility mode, so tests never need Docker and never touch the
# development database. Flyway still runs the same migrations against it.
# ${random.uuid} gives every Spring test context its own fresh database,
# exactly like every context used to get fresh in-memory repositories.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
