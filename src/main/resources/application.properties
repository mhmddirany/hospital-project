spring.application.name=demo

# Issue 21: bootstrap admin account, created once at startup if it
# doesn't already exist (see lab.java.demo.config.AdminBootstrap) so
# there's an initial ADMIN able to create every other account via
# POST /api/users. These are development-only defaults -- override both
# with the APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD environment variables
# before deploying anywhere real; see README.md.
app.admin.username=admin
app.admin.password=admin123

# Issue 21: JWT signing (see lab.java.demo.security.JwtService). The
# secret below is a development-only default -- override it with the
# APP_JWT_SECRET environment variable before deploying anywhere real; see
# README.md. It must stay at least 32 characters (256 bits) long for
# HMAC-SHA signing.
app.jwt.secret=dev-only-insecure-default-jwt-signing-secret-change-via-APP_JWT_SECRET-env-var
app.jwt.expiration-ms=3600000

# Issue 16 follow-up: real email/SMS providers, opt-in. "console" (the
# default -- also used if either property is left unset) keeps the
# existing ConsoleEmailNotifier/ConsoleSMSNotifier demo stand-ins, which
# just log instead of sending anything. Switch to "smtp"/"twilio" only
# after filling in the real provider settings below -- see README.md.
app.notifications.email.provider=console
app.notifications.sms.provider=console

# Used only when app.notifications.email.provider=smtp. These are the
# *standard* Spring Boot mail properties (spring.mail.*), auto-configured
# into the JavaMailSender that SmtpEmailNotifier sends through -- they
# work with Gmail SMTP, SendGrid's SMTP relay, AWS SES, or any other SMTP
# server. Left blank/commented here on purpose: never commit real SMTP
# credentials. Override via SPRING_MAIL_HOST / SPRING_MAIL_USERNAME /
# SPRING_MAIL_PASSWORD (etc.) environment variables instead.
#spring.mail.host=smtp.example.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
app.notifications.email.from=no-reply@example.com

# Used only when app.notifications.sms.provider=twilio. From your Twilio
# console (https://console.twilio.com). Left blank on purpose -- never
# commit real values here. Override via
# APP_NOTIFICATIONS_SMS_ACCOUNT_SID / APP_NOTIFICATIONS_SMS_AUTH_TOKEN /
# APP_NOTIFICATIONS_SMS_FROM_NUMBER environment variables.
app.notifications.sms.account-sid=
app.notifications.sms.auth-token=
app.notifications.sms.from-number=

# Roadmap step 1: PostgreSQL, started locally with `docker compose up -d`
# (see docker-compose.yml). These are development-only defaults; override
# them with the SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME /
# SPRING_DATASOURCE_PASSWORD environment variables anywhere real.
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital
spring.datasource.username=hospital
spring.datasource.password=hospital

# The schema is owned by Flyway (versioned SQL in
# src/main/resources/db/migration), never generated by Hibernate.
# "validate" makes startup fail fast if an @Entity and the tables disagree.
spring.jpa.hibernate.ddl-auto=validate
# No lazy database loading during JSON rendering: every relationship the API
# returns is loaded eagerly inside the service layer, so keep the
# connection-per-request "open session in view" pattern switched off.
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Step 2: list endpoints are paginated. A client can ask for ?size=..., but
# never more than this many rows per page -- larger values are quietly
# capped -- so one request can't pull the whole table.
spring.data.web.pageable.max-page-size=100
